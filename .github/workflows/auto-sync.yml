name: Auto Sync Code (PubSub Trigger)

on:
  repository_dispatch:
    types: [upstream_code_updated]
  workflow_dispatch:

jobs:
  sync-code:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Repo 2
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Fetch and Merge Code Only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/dipk6545/NetSentry.git
          git fetch upstream main
          git checkout upstream/main -- netsentry/ configs/ docker/ scripts/ tests/ dags/ pyproject.toml .github/workflows/cloud-retraining.yml
          if ! git diff --staged --quiet; then
            git commit -m "chore(sync): pubsub auto-sync from dipk6545/NetSentry"
            git push origin main
          fi
