name: Cloud Scheduled Retraining Pipeline

on:
  schedule:
    # Runs every 14 days at 02:00 UTC (14-day production cycle)
    - cron: '0 2 */14 * *'
  # Allows you to trigger it manually anytime with a single click in GitHub!
  workflow_dispatch:
    inputs:
      force_tuning:
        description: 'Force emergency Optuna HPO even if no drift detected'
        required: false
        type: boolean
        default: false

jobs:
  retrain-and-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies (OpenMP for XGBoost)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgomp1

      - name: Install NetSentry Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docker/requirements.pipeline.txt
          pip install -e .

      - name: Download Training Dataset from Cloudflare R2
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          python -c "from netsentry.data.storage import download_file_from_r2; download_file_from_r2('data/clean_network_flows.parquet', 'data/processed/clean_network_flows.parquet')"

      - name: Run Baseline Tournament
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_S3_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          AWS_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          python scripts/train_baselines.py

      - name: Run Production Retraining & Champion Promotion
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_S3_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          AWS_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          EXTRA_ARGS=""
          if [ "${{ inputs.force_tuning }}" = "true" ]; then
            EXTRA_ARGS="--force-tuning"
          fi
          python scripts/run_pipeline.py --top-k 3 --tracking-uri "${{ secrets.MLFLOW_TRACKING_URI }}" $EXTRA_ARGS

      - name: Upload Drift & Evaluation Artifacts to GitHub
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retraining-artifacts
          path: |
            artifacts/drift/
            artifacts/baselines/
            artifacts/evaluation/
