name: NetSentry Pipeline CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'configs/**'
      - '*.md'
  pull_request:
    branches: [ main ]

jobs:
  # --------------------------------------------------------------------------
  # Job 1: Test & Lint Code Quality
  # --------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docker/requirements.pipeline.txt
          pip install pytest ruff
          pip install -e .

      - name: Run Ruff Linter
        run: |
          ruff check netsentry/ configs/ scripts/

      - name: Run Unit Tests
        run: |
          pytest tests/test_features_*.py -v

  # --------------------------------------------------------------------------
  # Job 2: Build & Verify Docker Pipeline Image
  # --------------------------------------------------------------------------
  docker-build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Pipeline Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.pipeline
          push: false
          tags: netsentry-pipeline:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Publishes event to Repo 2 whenever main branch gets new commits
  notify-repo2:
    needs: [test, docker-build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Event to Repo 2
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.DISPATCH_PAT }}" \
            https://api.github.com/repos/subhadipk920/NetSentry-2/dispatches \
            -d '{"event_type":"upstream_code_updated"}'