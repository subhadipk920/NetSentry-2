x-airflow-common: &airflow-common
  image: apache/airflow:2.8.1-python3.10
  env_file:
    - ../.env
  environment:
    - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=${AIRFLOW_DATABASE_CONN}
    - AIRFLOW__DATABASE__SQL_ALCHEMY_POOL_SIZE=1
    - AIRFLOW__DATABASE__SQL_ALCHEMY_MAX_OVERFLOW=1
    - AIRFLOW__WEBSERVER__WORKERS=1
    - AIRFLOW__CORE__FERNET_KEY=46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLbfzqJZPo=
    - AIRFLOW__WEBSERVER__SECRET_KEY=netsentry_airflow_secret_key_prod_2026!
    - AIRFLOW__CORE__LOAD_EXAMPLES=False
    - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=True
    - NETSENTRY_HOST_DIR=${NETSENTRY_HOST_DIR:-D:/ML End to End Projects/Made with ML/NetSentry v2}
    - MLFLOW_TRACKING_URI=${MLFLOW_TRACKING_URI}
    - R2_BUCKET_NAME=${R2_BUCKET_NAME}
    - R2_ENDPOINT_URL=${R2_ENDPOINT_URL}
    - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
    - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
  volumes:
    - ../dags:/opt/airflow/dags
    - ../artifacts:/opt/airflow/artifacts
    - airflow-logs:/opt/airflow/logs
    - //var/run/docker.sock:/var/run/docker.sock

services:
  airflow-init:
    <<: *airflow-common
    command: version
    entrypoint:
      - /bin/bash
      - -c
      - |
        airflow db migrate &&
        airflow users create \
          --username admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@netsentry.io \
          --password admin || true

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  airflow-logs: