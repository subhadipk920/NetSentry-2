version: "3.8"

services:
  mlflow:
    image: mlflow/mlflow:v2.11.3
    container_name: netsentry-mlflow
    restart: always
    ports:
      - "5000:5000"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.50"
    environment:
      - MLFLOW_TRACKING_URI=${MLFLOW_TRACKING_URI}
      - MLFLOW_S3_ENDPOINT_URL=${MLFLOW_S3_ENDPOINT_URL}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
    command: >
      mlflow server
      --backend-store-uri ${MLFLOW_TRACKING_URI}
      --default-artifact-root s3://netsentry/mlflow-artifacts
      --host 0.0.0.0
      --port 5000
