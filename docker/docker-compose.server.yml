services:
  netsentry-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    image: netsentry-server:v2
    container_name: netsentry-server-v2
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      - PORT=8000
      - PYTHONPATH=/app
      - UPSTREAM_HOST=${UPSTREAM_HOST:-http://host.docker.internal:9000}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
