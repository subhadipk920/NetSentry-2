[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "netsentry"
version = "0.2.0" # Test PubSub Auto-Sync Pass 2
description = "Production MLOps Network Intrusion Detection System"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "NetSentry Engineering Team"}
]
dependencies = [
    "polars>=0.20.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",
    "optuna>=3.4.0",
    "mlflow>=2.10.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "black>=24.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["netsentry*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# E: pycodestyle errors, F: Pyflakes (undefined variables, syntax, etc.)
select = ["E", "F"]
# Ignore minor style warnings like line-length (E501), ambiguous vars, etc.
ignore = [
    "E501",  # Line too long
    "E402",  # Module level import not at top of file
    "F401",  # Unused import (allow while developing)
    "F841",  # Local variable name assigned but never used
    "E741",  # Ambiguous variable name
]

